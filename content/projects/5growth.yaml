referencePerson: Claudio Casetti
description: Validate through field-trials the actual performance of 5G system
  deployed on the premises of vertical industries, and optimize the performance
  using automation and Artificial Intelligence (AI)-driven solutions. Nine use
  cases in three pilot sectors, Industry 4.0, Transport, and Energy, to be
  field-trialed on four vertical-owned sites in Spain, Italy, and Portugal.
