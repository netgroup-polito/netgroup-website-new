description: TOSHI combines recent Linux kernel technologies that are now
  reaching their maturity with AI/ML-based techniques to analyze events and
  detect anomalies. These two main pillars have not been integrated in any
  product to enforce host security and their unique combination has the
  potential to address a constantly growing security market.
