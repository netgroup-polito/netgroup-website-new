description: PREDICT-6G builds an end-to-end deterministic 6G network
  architecture ensuring high reliability and precise timing. It combines a
  multi-domain AI-driven control plane, digital twin framework, and
  multi-technology data plane. NetGroup leads the task on predictability and
  resource allocation in multi-domain environments.
