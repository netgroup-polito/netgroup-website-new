name: Software-based network infrastructures and services
order: 100
reference: prof. Guido Marchetto
description: We study software-defined and virtualized network infrastructures,
  including SDN, NFV, cloud-native networking, and programmable networks. Our
  work focuses on network orchestration, service deployment, intent-based
  management, and automation of network services across distributed
  infrastructures.
