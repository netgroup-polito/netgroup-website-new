name: Network security analysis and verification
order: 10
reference: prof. Riccardo Sisto
description: We develop formal and automated techniques to analyze, verify, and
  validate the security of networked systems. Research includes vulnerability
  analysis, policy verification, firewall analysis, protocol verification,
  traffic monitoring, and methods for ensuring the correctness of security
  configurations.
