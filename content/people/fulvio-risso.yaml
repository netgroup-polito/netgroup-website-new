description: My research began in high-speed packet processing, where I
  developed tools like NetPDL, NetVM, and the NetBee library to achieve flexible
  10Gbps+ performance. This work extended into traffic classification and
  hardware acceleration, notably producing the iNFAnt GPU pattern-matching
  engine. With the shift toward cloud and virtualization, I pivoted to
  programmable network services, launching open-source initiatives like FROG,
  CrownLabs for remote education, and Liqo for seamless computing continuums. I
  remain active in networking through eBPF via the Polycube framework, which
  enables high-performance network services directly within the Linux kernel.
