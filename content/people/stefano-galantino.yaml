description: As a member of the NETGROUP (Computer Networks Group), my work
  primarily focuses on the orchestration of computational resources across the
  edge-to-cloud continuum, exploring how network software engineering and
  distributed systems intersect to create more efficient and dynamic
  infrastructures. My research interests lie in the areas of orchestration for
  edge-to-cloud computing resources with a focus also on energy consumption.
